name: One-shot core logic hotfix

on:
  push:
    paths:
      - '.github/workflows/core-logic-hotfix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply core logic fixes
        run: python3 tools/core_logic_hotfix.py

      - name: Run conversation unit tests
        run: |
          chmod +x ./gradlew
          ./gradlew :android:feature:conversation:testDebugUnitTest --no-daemon

      - name: Commit fixes and remove temporary files
        run: |
          rm -f .github/workflows/core-logic-hotfix.yml tools/core_logic_hotfix.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add android/feature/conversation/src/main/kotlin/kz/lvk/languagelearning/feature/conversation/ConversationViewModel.kt \
                  android/feature/conversation/src/test/kotlin/kz/lvk/languagelearning/feature/conversation/ConversationResponseParserTest.kt \
                  .github/workflows/core-logic-hotfix.yml \
                  tools/core_logic_hotfix.py
          git commit -m 'Fix tutor correction state and translation fallback'
          git push origin HEAD:main
