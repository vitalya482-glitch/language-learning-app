name: Android Dev APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-dev-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Unit tests
        run: gradle :android:core:common:test

      - name: Build signed dev APK
        run: gradle :android:app:assembleDevRelease

      - name: Prepare artifact
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/dev/release/app-dev-release.apk dist/language-learning-dev.apk
          sha256sum dist/language-learning-dev.apk | tee dist/language-learning-dev.apk.sha256

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: language-learning-dev-apk
          path: |
            dist/language-learning-dev.apk
            dist/language-learning-dev.apk.sha256

      - name: Publish rolling dev release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete dev-latest --yes --cleanup-tag || true
          gh release create dev-latest \
            --target "$GITHUB_SHA" \
            --title "Development build" \
            --notes "Automatic Android development build from main. Commit: $GITHUB_SHA" \
            --prerelease
          gh release upload dev-latest \
            dist/language-learning-dev.apk \
            dist/language-learning-dev.apk.sha256
