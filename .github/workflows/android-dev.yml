name: Android CI & Dev Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      publish_requested: ${{ steps.release_gate.outputs.publish }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Verify Gradle wrapper
        run: ./gradlew --version

      - name: Decide whether this commit is a release
        id: release_gate
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "Manual run: publishing is enabled."
          elif git rev-parse HEAD^ >/dev/null 2>&1 && ! git diff --quiet HEAD^ HEAD -- version.properties; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "version.properties changed: publishing is enabled."
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "No version bump: CI will verify the build without replacing dev-latest."
          fi

      - name: Validate versionCode increases on a version bump
        if: steps.release_gate.outputs.publish == 'true' && github.event_name == 'push'
        shell: bash
        run: |
          CURRENT_CODE=$(awk -F= '$1 == "ANDROID_VERSION_CODE" {print $2}' version.properties | tr -d '[:space:]')
          PREVIOUS_CODE=$(git show HEAD^:version.properties 2>/dev/null | awk -F= '$1 == "ANDROID_VERSION_CODE" {print $2}' | tr -d '[:space:]' || true)
          if [[ -n "$PREVIOUS_CODE" && "$CURRENT_CODE" -le "$PREVIOUS_CODE" ]]; then
            echo "ANDROID_VERSION_CODE must increase: previous=$PREVIOUS_CODE current=$CURRENT_CODE" >&2
            exit 1
          fi

      - name: Unit tests
        run: ./gradlew :android:core:common:test

      - name: Build signed dev APK
        run: ./gradlew :android:app:assembleDevRelease

      - name: Prepare reproducible release bundle
        run: |
          COMMIT_SUBJECT=$(git log -1 --pretty=%s)
          python3 tools/release/prepare_android_release.py \
            --version-file version.properties \
            --metadata android/app/build/outputs/apk/dev/release/output-metadata.json \
            --apk-directory android/app/build/outputs/apk/dev/release \
            --output-directory dist \
            --repository "$GITHUB_REPOSITORY" \
            --release-tag dev-latest \
            --commit "$GITHUB_SHA" \
            --commit-subject "$COMMIT_SUBJECT" \
            --run-id "$GITHUB_RUN_ID"

      - name: Upload build bundle
        uses: actions/upload-artifact@v4
        with:
          name: language-learning-dev-release
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/language-learning-dev.apk
            dist/language-learning-dev.apk.sha256
            dist/language-learning-manifest.json
            dist/build-info.json
            dist/release-notes.md

  publish:
    name: Publish rolling dev release
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.build.outputs.publish_requested == 'true'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download build bundle
        uses: actions/download-artifact@v5
        with:
          name: language-learning-dev-release
          path: dist

      - name: Publish stable dev-latest URLs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION_NAME=$(python3 -c 'import json; print(json.load(open("dist/build-info.json", encoding="utf-8"))["versionName"])')

          git tag -f dev-latest "$GITHUB_SHA"
          git push origin refs/tags/dev-latest --force

          if gh release view dev-latest >/dev/null 2>&1; then
            gh release edit dev-latest \
              --title "Development build ${VERSION_NAME}" \
              --notes-file dist/release-notes.md
          else
            gh release create dev-latest \
              --target "$GITHUB_SHA" \
              --title "Development build ${VERSION_NAME}" \
              --notes-file dist/release-notes.md \
              --prerelease
          fi

          gh release upload dev-latest \
            dist/language-learning-dev.apk \
            dist/language-learning-dev.apk.sha256 \
            dist/language-learning-manifest.json \
            dist/build-info.json \
            --clobber
